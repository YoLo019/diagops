global:
  scrape_interval: 2s
  evaluation_interval: 2s

rule_files:
  - /etc/prometheus/rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: app
    static_configs:
      - targets:
          - app:8000
  - job_name: dependency
    static_configs:
      - targets:
          - dependency:8000
