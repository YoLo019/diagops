storage:
  url: sqlite:///data/diagops.db

providers:
  mock:
    enabled: true
  log_file:
    enabled: true
    paths:
      - data/sample-logs/checkout-service.log
  prometheus:
    enabled: false
    base_url: http://127.0.0.1:9090
  deployment_file:
    enabled: true
    path: data/deployments/deployments.json
  service_catalog:
    enabled: true
    path: config/services.yaml
  # 离线 incident package 根目录；缺席 source 绝不回退 mock。
  local_package:
    enabled: false
    path: data/incident-packages/default

agents:
  enabled: false
  provider: openai
  model: null
  max_turns: 8
  timeout_seconds: 60
  token_budget: 12000
  strategy: fixed
  max_tool_calls_per_specialist: 3
  max_total_tool_calls: 8
  tool_timeout_seconds: 10
  # generic Chat Completions endpoint；API key 只允许 DIAGOPS_AGENTS_API_KEY
  # 环境变量，绝不写入本文件。
  openai_compatible:
    base_url: null
    api_mode: chat_completions
    timeout_seconds: 30
    max_retries: 2

benchmark:
  results_path: output/benchmarks/openrca

runtime:
  enabled: true
  max_concurrent_runs: 4
  max_parallel_steps_per_run: 3
  lease_seconds: 30
  heartbeat_seconds: 10
  opentelemetry:
    enabled: false
    endpoint: null
